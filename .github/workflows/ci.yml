name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Registry dependencies are built with --cap-lints allow, so this only
    # promotes warnings in arig's own code.
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo build --verbose
      - run: cargo test --verbose
      - name: schema drift check
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo run --quiet -- schema > /tmp/schema.json
          diff arig.schema.json /tmp/schema.json

  # The docker runtime's tests drive a real daemon, which only the ubuntu
  # runners have. They are #[ignore]d so the matrix above stays green without
  # one.
  docker:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: docker version
      - run: cargo test --verbose -- --ignored docker
